[project]
name = "carbon-aware-backend"
version = "0.1.0"
description = "Carbon-Aware Supply Chain API"
requires-python = ">=3.9"
dependencies = [
	"fastapi>=0.115",
	"uvicorn[standard]>=0.30",
	"sqlalchemy>=2.0",
	"python-multipart>=0.0.9",
	"alembic>=1.13",
	"reportlab>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["pytest>=8.0"]
ml = [
	"joblib>=1.4",
	"numpy>=2.0",
	"pandas>=2.2",
	"scikit-learn==1.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
